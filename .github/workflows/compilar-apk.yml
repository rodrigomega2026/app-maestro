name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/release/app-release.apk Maestro.apk

      - name: Guardar el APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Maestro-apk
          path: Maestro.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          gh release create "$VERSION" Maestro.apk \
            --title "Maestro Presupuestos $VERSION" \
            --notes "APK compilado automáticamente. Descarga Maestro.apk e instálalo en el teléfono." \
            --latest
