# Crea el APK cada vez que subes cambios a GitHub.
# El APK (para instalar en tu teléfono) y el AAB (para subir a Play Store) quedan en
# la pestaña "Actions" > la compilación > "Artifacts".
name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Los servidores de GitHub ya traen Android instalado: no se descarga nada extra
      # (antes este paso fallaba a veces al bajar herramientas desde Google).
      # La clave de firma se guarda en Settings > Secrets and variables > Actions
      - name: Preparar clave de firma
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          if [ -z "$FIRMA_BASE64" ]; then
            echo "::error::Falta el secreto FIRMA_BASE64 (clave de firma). Agrégalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/maestro-subida.jks"
          echo "FIRMA_ARCHIVO=$RUNNER_TEMP/maestro-subida.jks" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Maestro-APK
          path: app/build/outputs/apk/release/*.apk

      # Archivo para subir a Google Play Console
      - uses: actions/upload-artifact@v4
        with:
          name: Maestro-AAB-PlayStore
          path: app/build/outputs/bundle/release/*.aab
