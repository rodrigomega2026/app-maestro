plugins {
    id 'com.android.application'
}

// La página web (index.html y config.js) está en la raíz del repositorio.
// Antes de compilar se copia dentro de la app: así se edita en un solo lugar.
def carpetaWeb = file("$buildDir/web-assets")
tasks.register('copiarPaginaWeb', Copy) {
    from(rootProject.projectDir) {
        include 'index.html', 'config.js', '*.png', '*.jpg', '*.svg', '*.css', 'img/**'
    }
    into carpetaWeb
}
preBuild.dependsOn 'copiarPaginaWeb'

android {
    namespace 'cl.maestro.presupuestos'
    compileSdk 36

    defaultConfig {
        applicationId 'cl.maestro.presupuestos'
        minSdk 24
        targetSdk 36
        // En GitHub cada compilación sube el número de versión solo
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    sourceSets {
        main {
            assets.srcDir carpetaWeb
        }
    }

    // Firma para Play Store. La clave NO está en el repositorio: GitHub la entrega
    // desde los "Secrets" FIRMA_BASE64 y FIRMA_CLAVE (ver .github/workflows/compilar-apk.yml).
    signingConfigs {
        app {
            def archivo = System.getenv('FIRMA_ARCHIVO')
            if (archivo) {
                storeFile file(archivo)
                storePassword System.getenv('FIRMA_CLAVE')
                keyAlias 'maestro-subida'
                keyPassword System.getenv('FIRMA_CLAVE')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('FIRMA_ARCHIVO') ? signingConfigs.app : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Sirve la página desde https://appassets.androidplatform.net (guarda los presupuestos en el teléfono)
    implementation 'androidx.webkit:webkit:1.11.0'
    // Cobro de la suscripción con Google Play
    implementation 'com.android.billingclient:billing:8.0.0'
}
