<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maestro Presupuestos</title>
<meta name="theme-color" content="#16181B">
<style>
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#16181B; --muted:#5E6670; --line:#D9DDE2; --soft:#F5F6F8;
  --yellow:#F5C400; --yellow-ink:#16181B; --dark:#16181B; --dark2:#26292E;
  --ok:#1E7D4F; --ok-soft:#DDF1E6; --warn:#A35F00; --warn-soft:#FFF1D6; --bad:#B42318; --bad-soft:#FDECEA;
  --shadow:0 6px 24px rgba(10,15,20,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
/* barra superior */
.top{position:sticky;top:0;z-index:50;background:var(--dark);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.top h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:.74rem;font-weight:400;color:#B9C0C8;letter-spacing:0}
.top .ico{width:38px;height:38px;border-radius:10px;border:0;background:var(--dark2);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:1.15rem;flex:0 0 38px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--yellow);display:grid;place-items:center;flex:0 0 38px}
.wrap{padding:14px;max-width:760px;margin:0 auto;display:grid;gap:12px;padding-bottom:110px}
/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:1rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .n{width:24px;height:24px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;font-size:.8rem}
.lbl{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-weight:700;font-size:.86rem}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(245,196,0,.45)}
textarea.inp{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.y{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn.d{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.red{color:var(--bad);border-color:#F1C4BF}
.btn.sm{padding:7px 11px;font-size:.84rem;border-radius:9px}
.btn.full{width:100%}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.sp{flex:1}
/* lista de presupuestos */
.pres{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left;width:100%}
.pres b{font-size:1rem}
.pres .tot{font-weight:800;text-align:right;font-size:1.02rem}
.est{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px;margin-right:6px}
.est.borrador{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.est.enviado{background:var(--warn-soft);color:var(--warn)}
.est.aceptado{background:var(--ok-soft);color:var(--ok)}
.est.rechazado{background:var(--bad-soft);color:var(--bad)}
.vacio{text-align:center;padding:28px 18px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}
.vacio b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
/* plantillas */
.plants{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.plant{border:2px solid #6F7882;background:var(--surface);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:3px;align-content:start;box-shadow:0 2px 4px rgba(16,24,32,.16)}
.plant:active{border-color:var(--ink)}
.plant .e{font-size:1.5rem;line-height:1;height:30px;display:flex;align-items:center}
.plant b{font-size:.92rem}
.plant span{font-size:.76rem;color:var(--muted)}
/* partidas del presupuesto */
.item{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.item+.item{margin-top:8px}
.item .cab{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.ic{width:36px;height:36px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-size:1.15rem;border:1px solid var(--line)}
.item .nom{font-weight:700;line-height:1.25}
.item .sub{font-size:.8rem;color:var(--muted)}
.item .val{text-align:right;font-weight:800}
.item .cant{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:0 12px 10px}
.item .cant .inp{padding:8px 10px;text-align:right;font-weight:700;font-size:1.05rem}
.item .det{border-top:1px solid var(--line);background:var(--soft);padding:10px 12px;display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px;gap:6px;align-items:center;font-size:.86rem}
.mrow .inp{padding:6px 8px;text-align:right}
.mrow.h{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.tog{border:0;background:none;color:var(--muted);font-weight:700;font-size:.8rem;cursor:pointer;padding:0}
.badge{font-size:.68rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}
/* totales */
.tot-grid{display:grid;gap:6px}
.tl{display:flex;justify-content:space-between;gap:10px}
.tl.big{font-size:1.3rem;font-weight:800;border-top:2px solid var(--ink);padding-top:8px;margin-top:4px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-weight:700;font-size:.84rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.switch{display:flex;gap:10px;align-items:center;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--ink)}
/* barra inferior */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;box-shadow:0 -4px 18px rgba(0,0,0,.08)}
.bottom .t{flex:1;min-width:0}
.bottom .t b{display:block;font-size:1.2rem}
.bottom .t span{font-size:.78rem;color:var(--muted)}
/* hojas (modales) */
.bg{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet .sh h3{margin:0;font-size:1.1rem;flex:1}
.sheet .sb{padding:14px 16px;overflow:auto;display:grid;gap:8px}
.sheet .sf{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.cat{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer;width:100%}
.cat .p{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.grp{margin:8px 2px 0}
/* documento */
.doc{background:#fff;color:#111;border-radius:14px;border:1px solid var(--line);padding:22px 20px;font-size:.9rem}
.doc .dh{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #111;padding-bottom:12px;margin-bottom:12px}
.doc .dh h2{margin:0;font-size:1.35rem}
.doc .yb{display:inline-block;background:var(--yellow);padding:2px 8px;border-radius:4px;font-weight:800;font-size:.78rem;letter-spacing:.06em}
.doc table{width:100%;border-collapse:collapse;margin:8px 0}
.doc th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:#555;border-bottom:1.5px solid #111;padding:6px 5px}
.doc td{border-bottom:1px solid #ddd;padding:6px 5px;vertical-align:top}
.doc td.r,.doc th.r{text-align:right;white-space:nowrap}
.doc .sec{font-weight:800;margin:16px 0 4px;font-size:.95rem}
.doc .totbox{margin-left:auto;max-width:330px;display:grid;gap:4px;margin-top:8px}
.doc .firma{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px;font-size:.8rem;text-align:center}
.doc .firma div{border-top:1px solid #111;padding-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--dark);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:200;max-width:calc(100% - 32px);text-align:center}
.preciosbtn{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--yellow);background:#FFFBEA;cursor:pointer}
.preciosbtn .e{font-size:1.5rem}.preciosbtn .fl{font-size:1.6rem;font-weight:800}.preciosbtn .small{color:var(--muted)}
.sodi{display:inline-block;margin-top:4px;padding:4px 10px;border-radius:8px;background:#E3ECFF;color:#1D4ED8;font-weight:700;font-size:.82rem;text-decoration:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}
.logobox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logoprev{width:88px;height:64px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:var(--soft);overflow:hidden;flex:0 0 88px}
.logoprev img{max-width:100%;max-height:100%;object-fit:contain}
.doc .lg{display:block;max-height:70px;max-width:180px;object-fit:contain;margin-bottom:8px}
.aviso{background:var(--warn-soft);color:#6B4300;border-radius:10px;padding:10px 12px;font-size:.84rem}
@media (max-width:420px){.two{grid-template-columns:1fr}.mrow{grid-template-columns:minmax(0,1fr) 80px 84px}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .top,.bottom,.noprint,.toast{display:none!important}
  .wrap{padding:0;max-width:none}
  .doc{border:0;padding:0;border-radius:0}
  tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

const hoy = () => isoLocal(new Date());

const leerNum = v => { const x = parseFloat(String(v).replace(/\./g,"").replace(",", ".")); return isFinite(x) ? x : 0; };
const leerDec = v => { let t = String(v).trim().replace(/\s/g, "");
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");          // 1.234,5
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");        // 1.234 (miles)
  const x = parseFloat(t); return isFinite(x) ? x : 0; };
// número para escribir dentro de una casilla (sin separador de miles, coma decimal)
const ni = (n, d=2) => (Math.round((+n || 0) * 10**d) / 10**d).toLocaleString("es-CL", {maximumFractionDigits:d, useGrouping:false});

const todosMat = () => ({...MATERIALES, ...S.misMat});
const existeMat = id => !!(MATERIALES[id] || S.misMat[id]);
const mat = id => { const m = MATERIALES[id] || S.misMat[id] || {n:id, u:"un", p:0, f:""}; const p = S.precios.mat[id]; return {...m, p: p != null ? p : m.p, editado: p != null}; };
const part = id => { const b = PARTIDAS.find(x => x.id === id); if (!b) return null; const mo = S.precios.mo[id]; return {...b, mo: mo || b.mo, editado: !!mo}; };
const moSegun = (rango, nivel) => nivel === "min" ? rango[0] : nivel === "max" ? rango[1] : Math.round((rango[0] + rango[1]) / 2 / 100) * 100;

/* =====================================================================
   CÁLCULOS
   ===================================================================== */
function nuevoItem(pid, cant) {
  const p = part(pid);
  return { pid, n:p.n, e:p.e, u:p.u, cant: Math.round(cant * 100) / 100, rango:[...p.mo], mo: moSegun(p.mo, S.nivel), moManual:false,
    rend: p.rend ? [...p.rend] : null, obs:p.obs, conMat:true,
    mats: p.mats.map(([id, q]) => { const m = mat(id); return {id, n:m.n, u:m.u, q, p:m.p}; }) };
}
// Los presupuestos en borrador siguen la lista de "Precios": si cambias un precio allá, se actualiza aquí.
// No se tocan los valores que escribiste a mano dentro del presupuesto, ni los presupuestos ya enviados/aceptados.
function sincronizar(pr) {
  if ((pr.estado || "borrador") !== "borrador") return;
  for (const it of pr.items) {
    const b = part(it.pid); if (!b) continue;
    it.rango = [...b.mo];
    if (!it.moManual) it.mo = moSegun(b.mo, S.nivel);
    for (const m of it.mats) if (!m.pManual && existeMat(m.id)) { const x = mat(m.id); m.p = x.p; m.n = x.n; }
  }
}
function calcular(pr) {
  sincronizar(pr);
  let mo = 0, dias = 0;
  const lista = new Map();
  for (const it of pr.items) {
    mo += it.cant * it.mo;
    if (it.rend) dias += it.cant / ((it.rend[0] + it.rend[1]) / 2);
    if (!it.conMat) continue;
    for (const m of it.mats) {
      const x = lista.get(m.id) || {id:m.id, n:m.n, u:m.u, p:m.p, q:0};
      x.q += it.cant * m.q; x.p = m.p; lista.set(m.id, x);
    }
  }
  const mats = [...lista.values()].filter(m => m.q > 0).map(m => {
    const comprar = ENTERAS.has(m.u) ? Math.ceil(m.q - 1e-9) : Math.ceil(m.q * 100) / 100;
    return {...m, comprar, total: comprar * m.p};
  });
  const matTot = mats.reduce((a, m) => a + m.total, 0);
  const incl = pr.incluirMat !== false;
  const base = mo + (incl ? matTot : 0);
  const imprev = base * (pr.imprevistos || 0) / 100;
  const desc = pr.descuento || 0;
  return { mo, matTot, mats, imprev, desc, total: Math.max(0, base + imprev - desc), dias: Math.ceil(dias * 2) / 2, incl };
}

const estadoTxt = e => ({borrador:"Borrador", enviado:"Enviado", aceptado:"Aceptado", rechazado:"Rechazado"})[e] || "Borrador";

function crear(items, titulo) {
  S.contador++;
  const p = {id: Date.now().toString(36), num: S.contador, fecha: hoy(), mod: Date.now(), titulo: titulo || "", estado:"borrador",
    cliente:{nombre:"", tel:"", dir:""}, items, imprevistos:10, descuento:0, incluirMat:true, notas:""};

}

/* ---------- PLANTILLAS ---------- */
function pedirPlantilla(id) {
  const pl = PLANTILLAS.find(x => x.id === id);
  hoja(`${pl.e} ${pl.n}`, `
    <p class="small muted" style="margin:0">Ingresa las medidas. Después puedes cambiar cualquier cantidad.</p>
    ${pl.campos.map(([k, t, def]) => `<div class="field"><label for="pl_${k}">${esc(t)}</label><input class="inp" id="pl_${k}" inputmode="decimal" value="${ni(def)}"></div>`).join("")}`,
    `<button class="btn" onclick="cerrarHoja()">Cancelar</button><span class="sp"></span><button class="btn y" id="plOk">Calcular</button>`);
  $("#plOk").onclick = () => {
    const v = {}; for (const [k] of pl.campos) v[k] = leerDec($("#pl_" + k).value);
    const items = pl.arma(v).filter(([, c]) => c > 0).map(([pid, c]) => nuevoItem(pid, c));
    cerrarHoja(); crear(items, pl.n);
  };
}

function totalesHtml(c) {
  return `<div class="tl"><span>Mano de obra</span><span>${clp(c.mo)}</span></div>
    <div class="tl ${c.incl ? "" : "muted"}"><span>Materiales${c.incl ? "" : " (no incluidos)"}</span><span>${clp(c.matTot)}</span></div>

    <div class="tl big"><span>Total</span><span>${clp(c.total)}</span></div>
    ${c.dias ? `<div class="tl small muted"><span>Plazo estimado</span><span>≈ ${nf(c.dias, 1)} días hábiles</span></div>` : ""}`;
}
function listaHtml(c) {
  return `<h2>🛒 Lista de materiales</h2>` + (c.mats.length ? `<div class="mrow h"><span>Material</span><span style="text-align:right">Comprar</span><span style="text-align:right">Total</span></div>
    ${c.mats.map(m => `<div class="mrow"><span>${esc(m.n)}<br><span class="muted small">${clp(m.p)} / ${esc(m.u)}</span></span><span style="text-align:right" class="num"><b>${nf(m.comprar)}</b> ${esc(m.u)}</span><span style="text-align:right" class="num">${clp(m.total)}</span></div>`).join("")}
    <div class="tl" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><b>Total materiales</b><b class="num">${clp(c.matTot)}</b></div>
    <p class="small muted" style="margin:6px 0 0">Cantidades con pérdida incluida; sacos, planchas y unidades redondeados hacia arriba. Verifica en terreno.</p>`
    : `<p class="muted small" style="margin:0">Las partidas elegidas no llevan materiales.</p>`);
}
function refrescar() {
  const p = presActual(); const c = calcular(p);
  $("#totales").innerHTML = totalesHtml(c);
  $("#listaMat").innerHTML = listaHtml(c);
  $("#botTot").textContent = clp(c.total);
  $("#botSub").textContent = c.dias ? "≈ " + nf(c.dias, 1) + " días de trabajo" : "Total";
  p.items.forEach((it, i) => { const el = document.querySelector(`[data-tot="${i}"]`); if (el) el.innerHTML = itemTotHtml(it); });
}
const itemTot = it => it.cant * it.mo + (it.conMat ? it.mats.reduce((a, m) => a + it.cant * m.q * m.p, 0) : 0);
const itemTotHtml = it => `${clp(itemTot(it))}<br><span class="small muted" style="font-weight:400">MO ${clp(it.cant * it.mo)}</span>`;
function itemHtml(it, i) {
  const abierto = abiertos.has(i);
  const fuera = it.mo < it.rango[0] || it.mo > it.rango[1];
  return `<div class="item">
    <div class="cab"><span class="ic">${it.e}</span>
      <span><span class="nom">${esc(it.n)}</span><br><span class="sub">${clp(it.mo)} / ${esc(it.u)} mano de obra${it.obs ? " · " + esc(it.obs) : ""}</span></span>

    <div class="cant"><span class="small muted">Cantidad</span><input class="inp num" data-cant="${i}" inputmode="decimal" value="${ni(it.cant)}"><span class="small"><b>${esc(it.u)}</b></span>
      <button class="tog" data-abrir="${i}">${abierto ? "Ocultar ▴" : "Detalle ▾"}</button></div>
    ${abierto ? `<div class="det">
      <div class="two">
        <div class="field" style="margin:0"><label>Mano de obra por ${esc(it.u)}</label><input class="inp num" data-mo="${i}" inputmode="numeric" value="${Math.round(it.mo).toLocaleString("es-CL")}">
          <span class="small ${fuera ? "" : "muted"}" style="${fuera ? "color:var(--warn)" : ""}">Referencia: ${clp(it.rango[0])} – ${clp(it.rango[1])}</span></div>
        <div class="field" style="margin:0"><label>Rendimiento</label><div class="inp muted" style="background:var(--soft)">${it.rend ? nf(it.rend[0], 1) + " – " + nf(it.rend[1], 1) + " " + esc(it.u) + "/día" : "Variable"}</div></div>
      </div>
      ${it.mats.length ? `<label class="switch small"><input type="checkbox" data-conmat="${i}" ${it.conMat ? "checked" : ""}> Incluir materiales de este trabajo</label>
        ${it.conMat ? `<div class="mrow h"><span>Material (por ${esc(it.u)})</span><span style="text-align:right">Cantidad</span><span style="text-align:right">Precio</span></div>
        ${it.mats.map((m, j) => `<div class="mrow"><span>${esc(m.n)}<br><span class="muted small">Total: ${nf(it.cant * m.q)} ${esc(m.u)}</span> <button class="tog" style="color:var(--bad)" data-qmat="${i}:${j}">✕ quitar</button></span>
          <input class="inp num" data-mq="${i}:${j}" inputmode="decimal" value="${ni(m.q, 3)}"><input class="inp num" data-mp="${i}:${j}" inputmode="numeric" value="${Math.round(m.p).toLocaleString("es-CL")}"></div>`).join("")}` : ""}` : `<span class="small muted">Este trabajo no lleva materiales.</span>`}
      <div><button class="btn sm" data-addmat="${i}">+ Material</button></div>
      <div class="row end"><button class="btn sm red" data-quitar="${i}">Quitar partida</button></div>
    </div>` : ""}
  </div>`;
}
function enlazarItems(p) {
  const guarda = () => { p.mod = Date.now(); guardar(); refrescar(); };
  document.querySelectorAll("[data-cant]").forEach(el => el.oninput = () => { p.items[+el.dataset.cant].cant = leerDec(el.value); guarda(); });
  document.querySelectorAll("[data-mo]").forEach(el => el.oninput = () => { const it = p.items[+el.dataset.mo]; it.mo = leerNum(el.value); it.moManual = true; guarda(); });
  document.querySelectorAll("[data-mq]").forEach(el => el.oninput = () => { const [i, j] = el.dataset.mq.split(":").map(Number); p.items[i].mats[j].q = leerDec(el.value); guarda(); });
  document.querySelectorAll("[data-mp]").forEach(el => el.oninput = () => { const [i, j] = el.dataset.mp.split(":").map(Number); p.items[i].mats[j].p = leerNum(el.value); p.items[i].mats[j].pManual = true; guarda(); });
  document.querySelectorAll("[data-conmat]").forEach(el => el.onchange = () => { p.items[+el.dataset.conmat].conMat = el.checked; guardar(); vPres(); });
  document.querySelectorAll("[data-addmat]").forEach(el => el.onclick = () => elegirMaterial(+el.dataset.addmat));
  document.querySelectorAll("[data-qmat]").forEach(el => el.onclick = () => { const [i, j] = el.dataset.qmat.split(":").map(Number);
    p.items[i].mats.splice(j, 1); p.mod = Date.now(); guardar(); vPres(); });
  document.querySelectorAll("[data-abrir]").forEach(el => el.onclick = () => { const i = +el.dataset.abrir; abiertos.has(i) ? abiertos.delete(i) : abiertos.add(i); vPres(); });
  document.querySelectorAll("[data-quitar]").forEach(el => el.onclick = () => {
    const i = +el.dataset.quitar;
    confirmar("¿Quitar esta partida del presupuesto?", "Quitar", () => {
      p.items.splice(i, 1); abiertos.clear(); p.mod = Date.now(); guardar(); vPres(); toast("Partida quitada"); }); });
  // al salir de un campo numérico se ordena el formato
  document.querySelectorAll("[data-cant],[data-mo],[data-mq],[data-mp]").forEach(el => el.onblur = () => setTimeout(() => {
    const a = document.activeElement; if (vista === "pres" && !(a && a.matches("input,textarea,select"))) vPres(); }, 0));
}
function cambiarNivel(n) {
  S.nivel = n; const p = presActual();
  p.items.forEach(it => { if (!it.moManual) it.mo = moSegun(it.rango, n); });
  p.mod = Date.now(); guardar(); vPres();
}
function agregarPartida() {
  const grupos = [...new Set(PARTIDAS.map(x => x.g))];
  hoja("Agregar partida", `
    <input class="inp" id="bus" placeholder="Buscar (ej: pintura, baño, zinc, jornada)" autocomplete="off">
    <div class="chips" id="chips"><button class="chip on" data-cg="">Todos (${PARTIDAS.length})</button>${grupos.map(g => `<button class="chip" data-cg="${esc(g)}">${esc(g)}</button>`).join("")}</div>
    <div id="catl">${grupos.map(g => `<div class="lbl grp" data-g="${esc(g)}">${esc(g)}</div>` + PARTIDAS.filter(x => x.g === g).map(x => { const pp = part(x.id); return `
      <button class="cat" data-pid="${x.id}" data-g="${esc(x.g)}" data-txt="${esc((x.n + " " + x.g + " " + x.obs).toLowerCase())}"><span class="ic">${x.e}</span>
        <span><b>${esc(x.n)}</b>${x.tabla ? "" : `<span class="badge">estimado</span>`}<br><span class="small muted">${esc(x.obs || "por " + x.u)}</span></span>
        <span class="p num">${clp(pp.mo[0])} – ${clp(pp.mo[1])}<br>por ${esc(x.u)}</span></button>`; }).join("")).join("")}</div>`,
    `<button class="btn full" onclick="cerrarHoja()">Cerrar</button>`);
  let grupo = "";
  const filtra = () => { const q = $("#bus").value.trim().toLowerCase();
    document.querySelectorAll("#catl .cat").forEach(b => b.hidden = (q && !b.dataset.txt.includes(q)) || (grupo && b.dataset.g !== grupo));
    document.querySelectorAll("#catl .grp").forEach(g => { let s = g.nextElementSibling, ver = false; while (s && s.classList.contains("cat")) { if (!s.hidden) ver = true; s = s.nextElementSibling; } g.hidden = !ver; }); };
  $("#bus").oninput = filtra;
  document.querySelectorAll("#chips .chip").forEach(c => c.onclick = () => { grupo = c.dataset.cg;
    document.querySelectorAll("#chips .chip").forEach(x => x.classList.toggle("on", x === c)); filtra(); });
  document.querySelectorAll("#catl .cat").forEach(b => b.onclick = () => pedirCantidad(b.dataset.pid));
}
function pedirCantidad(pid) {
  const x = part(pid);
  const area = ["m²"].includes(x.u), vol = x.u === "m³";
  hoja(`${x.e} ${x.n}`, `
    <div class="field"><label for="q">Cantidad (${esc(x.u)})</label><input class="inp num" id="q" inputmode="decimal" placeholder="0" style="font-size:1.3rem;font-weight:800"></div>
    ${area || vol ? `<div class="lbl">o calcula con medidas</div>
      <div class="${vol ? "three" : "two"}"><div class="field"><label for="m1">Largo (m)</label><input class="inp" id="m1" inputmode="decimal"></div>
        <div class="field"><label for="m2">${area ? "Ancho o alto (m)" : "Ancho (m)"}</label><input class="inp" id="m2" inputmode="decimal"></div>
        ${vol ? `<div class="field"><label for="m3">Espesor (m)</label><input class="inp" id="m3" inputmode="decimal" placeholder="0,12"></div>` : ""}</div>` : ""}
    <p class="small muted" style="margin:0">Mano de obra referencial: ${clp(x.mo[0])} – ${clp(x.mo[1])} por ${esc(x.u)}${x.rend ? ` · rinde ${nf(x.rend[0], 1)}–${nf(x.rend[1], 1)} ${esc(x.u)}/día` : ""}.</p>`,
    `<button class="btn" onclick="agregarPartida()">← Volver</button><span class="sp"></span><button class="btn y" id="qOk">Agregar</button>`);
  const calc = () => { const a = leerDec($("#m1")?.value), b = leerDec($("#m2")?.value), c = vol ? leerDec($("#m3")?.value) : 1;
    if (a && b && c) $("#q").value = nf(a * b * c); };
  ["#m1","#m2","#m3"].forEach(s => { const el = $(s); if (el) el.oninput = calc; });
  setTimeout(() => $("#q").focus(), 50);
  $("#qOk").onclick = () => { const q = leerDec($("#q").value);
    if (!(q > 0)) { $("#q").focus(); toast("Escribe la cantidad"); return; }
    const p = presActual(); p.items.push(nuevoItem(pid, q)); p.mod = Date.now(); guardar(); cerrarHoja(); vPres(); toast("Partida agregada"); };
}
function opcionesPres() {

    ${["borrador","enviado","aceptado","rechazado"].map(e => `<button class="cat" style="grid-template-columns:minmax(0,1fr) auto" onclick="marcar('${e}')"><span><span class="est ${e}">${estadoTxt(e)}</span></span><span>${p.estado === e ? "✓" : ""}</span></button>`).join("")}`,
    `<button class="btn full" onclick="cerrarHoja()">Cerrar</button>`);
}
function marcar(e) { const p = presActual(); p.estado = e; p.mod = Date.now(); guardar(); cerrarHoja(); pintar(); toast("Marcado como " + estadoTxt(e).toLowerCase()); }
function borrarPres() {
  confirmar("¿Eliminar este presupuesto? No se puede deshacer.", "Eliminar", () => {
    S.pres = S.pres.filter(p => p.id !== actual); actual = null; guardar();

function duplicarPres() {

  S.pres.push(c); guardar(); ir("pres", c.id); toast("Presupuesto duplicado");
}

function textoPresupuesto(p) {
  const c = calcular(p), d = S.datos;
  const l = [];
  l.push(`*PRESUPUESTO N° ${String(p.num).padStart(3,"0")}*`);
  l.push(`${d.nombre || ""}${d.oficio ? " – " + d.oficio : ""}${d.tel ? " – " + d.tel : ""}`);
  l.push(`Fecha: ${fecha(p.fecha)}`);
  if (p.cliente.nombre) l.push(`Cliente: ${p.cliente.nombre}`);
  if (p.titulo) l.push(`Trabajo: ${p.titulo}`);
  l.push("");
  l.push("_Mano de obra:_");
  for (const it of p.items) l.push(`• ${it.n}: ${nf(it.cant)} ${it.u} → ${clp(it.mo * it.cant)}`);
  l.push("");
  l.push(`Mano de obra: ${clp(c.mo)}`);
  if (c.incl && c.mats.length) l.push(`Materiales: ${clp(c.matTot)}`);
  if (c.imprev) l.push(`Imprevistos: ${clp(c.imprev)}`);
  if (c.desc) l.push(`Descuento: −${clp(c.desc)}`);
  l.push(`*TOTAL: ${clp(c.total)}*`);
  if (!c.incl) l.push("(Materiales por cuenta del cliente)");
  if (c.dias) l.push(`Plazo estimado: ${nf(c.dias, 1)} días hábiles`);
  if (p.notas) { l.push(""); l.push(p.notas); }
  if (d.condiciones) { l.push(""); l.push(d.condiciones); }
  return l.join("\n");
}
function textoLista(p) {
  const c = calcular(p);
  return [`*Lista de materiales – ${p.titulo || "Presupuesto N° " + p.num}*`, "",
    ...c.mats.map(m => `• ${m.n}: ${nf(m.comprar)} ${m.u}`), "", `Valor referencial: ${clp(c.matTot)}`].join("\n");
}
function compartir(texto) {
  if (window.Android && Android.compartir) { Android.compartir(texto); return; }
  if (navigator.share) { navigator.share({text: texto}).catch(() => {}); return; }
  navigator.clipboard?.writeText(texto).then(() => toast("Texto copiado"), () => {});
}
function enviarWhatsApp() {
  const p = presActual(), t = textoPresupuesto(p);
  const num = (p.cliente.tel || "").replace(/[^\d]/g, "");
  const tel = num.length === 9 && num[0] === "9" ? "56" + num : num;
  const url = "https://wa.me/" + (tel.length >= 10 ? tel : "") + "?text=" + encodeURIComponent(t);
  if (p.estado === "borrador") { p.estado = "enviado"; p.mod = Date.now(); guardar(); }
  if (window.Android && Android.abrir) Android.abrir(url); else window.open(url, "_blank");
}

// Se achica la imagen para que no ocupe mucho espacio en el teléfono
function elegirLogo(alTerminar) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) return toast("Elige una imagen (JPG o PNG)");
    const lector = new FileReader();
    lector.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 400, k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        const cx = cv.getContext("2d");
        const png = /png|gif|webp|svg/.test(f.type);
        if (!png) { cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); }
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        S.datos.logo = png ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", 0.85);
        guardar(); toast("Logo guardado"); if (alTerminar) alTerminar();
      };
      img.onerror = () => toast("No se pudo leer la imagen");
      img.src = lector.result;
    };
    lector.readAsDataURL(f);
  };
  inp.click();
}
function quitarLogo(alTerminar) {
  confirmar("¿Quitar tu logo? Dejará de aparecer en todos los presupuestos.", "Quitar", () => { delete S.datos.logo; guardar(); toast("Logo quitado"); if (alTerminar) alTerminar(); });

function hoja(titulo, cuerpo, pie) {
  cerrarHoja();
  const bg = document.createElement("div"); bg.className = "bg"; bg.id = "hoja";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sh"><h3>${esc(titulo)}</h3><button class="btn sm" onclick="cerrarHoja()" aria-label="Cerrar">✕</button></div>
    <div class="sb">${cuerpo}</div>${pie ? `<div class="sf">${pie}</div>` : ""}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg) cerrarHoja(); });
  document.body.appendChild(bg);
}
function cerrarHoja() { const h = $("#hoja"); if (h) { h.remove(); return true; } return false; }
// Pregunta dentro de la app (el confirm() del navegador no funciona dentro del APK)
function confirmar(texto, botonSi, alAceptar) {
  hoja("Confirmar", `<p style="margin:0;font-size:1rem">${esc(texto)}</p>`,
    `<button class="btn" onclick="cerrarHoja()">Cancelar</button><span class="sp"></span><button class="btn d" id="cfOk" style="background:var(--bad);border-color:var(--bad)">${esc(botonSi)}</button>`);
  $("#cfOk").onclick = () => { cerrarHoja(); alAceptar(); };
}

pintar();
